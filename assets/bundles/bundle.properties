# ==================== Damage reduction ====================
status.raen-DamageReductionA.name = Damage Reduction-Low
status.raen-DamageReductionA.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 25%. Lethal damage resolves first and cannot be restored.
status.raen-DamageReductionB.name = Damage Reduction-Mid
status.raen-DamageReductionB.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 50%. Lethal damage resolves first and cannot be restored.
status.raen-DamageReductionC.name = Damage Reduction-High
status.raen-DamageReductionC.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 75%. Lethal damage resolves first and cannot be restored.

# ==================== Wingman ====================
status.raen-GenerateWingmanA.name = Wingman-Low
status.raen-GenerateWingmanA.description = Summons 1 wingman that orbits and fights, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.
status.raen-GenerateWingmanB.name = Wingman-Mid
status.raen-GenerateWingmanB.description = Summons 2 wingmen that orbit and fight, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.
status.raen-GenerateWingmanC.name = Wingman-High
status.raen-GenerateWingmanC.description = Summons 3 wingmen that orbit and fight, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.

# ==================== Shared health ====================
status.raen-TeamHealthA.name = Shared Health-Low
status.raen-TeamHealthA.description = Joins the shared pool while health is above 75% of max. Members are levelled to the same health percentage, and shields are split evenly across the team. Drops out below the threshold.
status.raen-TeamHealthB.name = Shared Health-Mid
status.raen-TeamHealthB.description = Joins the shared pool while health is above 50% of max. Members are levelled to the same health percentage, and shields are split evenly across the team. Drops out below the threshold.
status.raen-TeamHealthC.name = Shared Health-High
status.raen-TeamHealthC.description = Joins the shared pool while health is above 1 point, which amounts to full sharing. Members are levelled to the same health percentage, and shields are split evenly across the team.

# ==================== Shield to health ====================
status.raen-ShieldToHealthA.name = Shield to Health-Low
status.raen-ShieldToHealthA.description = While shielded and below full health, consumes 36 shield per second to restore 20 health.
status.raen-ShieldToHealthB.name = Shield to Health-Mid
status.raen-ShieldToHealthB.description = While shielded and below full health, consumes 50 shield per second to restore 40 health.
status.raen-ShieldToHealthC.name = Shield to Health-High
status.raen-ShieldToHealthC.description = While shielded and below full health, consumes 60 shield per second to restore 60 health.

# ==================== Health to shield ====================
status.raen-HealthToShieldA.name = Health to Shield-Low
status.raen-HealthToShieldA.description = 10% of any health lost is converted into shield.
status.raen-HealthToShieldB.name = Health to Shield-Mid
status.raen-HealthToShieldB.description = 20% of any health lost is converted into shield.
status.raen-HealthToShieldC.name = Health to Shield-High
status.raen-HealthToShieldC.description = 30% of any health lost is converted into shield.

# ==================== Artillery ====================
status.raen-BulletSpawnArtillery.name = Artillery
status.raen-BulletSpawnArtillery.description = Periodically fires a volley of fragmenting artillery shells in a random direction.
