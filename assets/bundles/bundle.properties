# ==================== Damage reduction ====================
status.raen-DamageReductionA.name = Damage Reduction-Low
status.raen-DamageReductionA.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 25%. Lethal damage resolves first and cannot be restored.
status.raen-DamageReductionB.name = Damage Reduction-Mid
status.raen-DamageReductionB.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 50%. Lethal damage resolves first and cannot be restored.
status.raen-DamageReductionC.name = Damage Reduction-High
status.raen-DamageReductionC.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 75%. Lethal damage resolves first and cannot be restored.

# ==================== Wingman ====================
status.raen-GenerateWingmanA.name = Wingman-Low
status.raen-GenerateWingmanA.description = Summons 1 wingman that orbits and fights, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.
status.raen-GenerateWingmanB.name = Wingman-Mid
status.raen-GenerateWingmanB.description = Summons 2 wingmen that orbit and fight, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.
status.raen-GenerateWingmanC.name = Wingman-High
status.raen-GenerateWingmanC.description = Summons 3 wingmen that orbit and fight, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.

# ==================== Shared health ====================
status.raen-TeamHealthA.name = Shared Health-Low
status.raen-TeamHealthA.description = Joins the shared pool while health is above 75% of max. Members are levelled to the same health percentage, and shields are split evenly across the team. Drops out below the threshold.
status.raen-TeamHealthB.name = Shared Health-Mid
status.raen-TeamHealthB.description = Joins the shared pool while health is above 50% of max. Members are levelled to the same health percentage, and shields are split evenly across the team. Drops out below the threshold.
status.raen-TeamHealthC.name = Shared Health-High
status.raen-TeamHealthC.description = Joins the shared pool while health is above 1 point, which amounts to full sharing. Members are levelled to the same health percentage, and shields are split evenly across the team.

# ==================== Shield to health ====================
status.raen-ShieldToHealthA.name = Shield to Health-Low
status.raen-ShieldToHealthA.description = While shielded and below full health, consumes 36 shield per second to restore 20 health.
status.raen-ShieldToHealthB.name = Shield to Health-Mid
status.raen-ShieldToHealthB.description = While shielded and below full health, consumes 50 shield per second to restore 40 health.
status.raen-ShieldToHealthC.name = Shield to Health-High
status.raen-ShieldToHealthC.description = While shielded and below full health, consumes 60 shield per second to restore 60 health.

# ==================== Health to shield ====================
status.raen-HealthToShieldA.name = Health to Shield-Low
status.raen-HealthToShieldA.description = 10% of any health lost is converted into shield.
status.raen-HealthToShieldB.name = Health to Shield-Mid
status.raen-HealthToShieldB.description = 20% of any health lost is converted into shield.
status.raen-HealthToShieldC.name = Health to Shield-High
status.raen-HealthToShieldC.description = 30% of any health lost is converted into shield.

# ==================== Reflect ====================
status.raen-ReflectA.name = Reflect-Low
status.raen-ReflectA.description = When health is reduced, part of the loss is dealt back to the nearest hostile target within 18 tiles - 10% at full health, rising to 45% when nearly dead. Full damage within 9 tiles, falling to half at the 18 tile edge.
status.raen-ReflectB.name = Reflect-Mid
status.raen-ReflectB.description = When health is reduced, part of the loss is dealt back to the nearest hostile target within 24 tiles - 20% at full health, rising to 60% when nearly dead. Full damage within 12 tiles, falling to half at the 24 tile edge.
status.raen-ReflectC.name = Reflect-High
status.raen-ReflectC.description = When health is reduced, part of the loss is dealt back to the nearest hostile target within 30 tiles - 30% at full health, rising to 75% when nearly dead. Full damage within 15 tiles, falling to half at the 30 tile edge.

# ==================== Link burst ====================
status.raen-LinkBurstA.name = Link Burst-Low
status.raen-LinkBurstA.description = Every 18 seconds, links 1 hostile within 13 tiles (units before buildings, higher health first) for 3 seconds. While linked, every point of health or shield the unit loses deals 0.75 damage to it.
status.raen-LinkBurstB.name = Link Burst-Mid
status.raen-LinkBurstB.description = Every 14 seconds, links 2 hostiles within 17 tiles (units before buildings, higher health first) for 4 seconds. While linked, every point of health or shield the unit loses deals 1.75 damage, split between them.
status.raen-LinkBurstC.name = Link Burst-High
status.raen-LinkBurstC.description = Every 10 seconds, links 3 hostiles within 21 tiles (units before buildings, higher health first) for 5 seconds. While linked, every point of health or shield the unit loses deals 3 damage, split between them.

# ==================== Link transfer ====================
status.raen-LinkTransferA.name = Link Transfer-Low
status.raen-LinkTransferA.description = Links 1 hostile (units before buildings) and 1 ally unit within 13 tiles. Every point of health or shield a linked hostile loses is converted at 75% into healing, split between linked allies; buildings have no shield, so only health loss counts. Healing fills health first, then shield up to max health. Damage to this unit and its allies is not reflected back.
status.raen-LinkTransferB.name = Link Transfer-Mid
status.raen-LinkTransferB.description = Links 2 hostiles (units before buildings) and 2 ally units within 17 tiles. Every point of health or shield a linked hostile loses is converted at 100% into healing, split between linked allies; buildings have no shield, so only health loss counts. Healing fills health first, then shield up to max health. Damage to this unit and its allies is not reflected back.
status.raen-LinkTransferC.name = Link Transfer-High
status.raen-LinkTransferC.description = Links 3 hostiles (units before buildings) and 2 ally units within 21 tiles. Every point of health or shield a linked hostile loses is converted at 125% into healing, split between linked allies; buildings have no shield, so only health loss counts. Healing fills health first, then shield up to max health. Damage to this unit and its allies is not reflected back.

# ==================== Split ====================
status.raen-SplitA.name = Split-Low
status.raen-SplitA.description = When health drops below 30% of max, splits into two copies of the same unit with 15% max health, then dies.
status.raen-SplitB.name = Split-Mid
status.raen-SplitB.description = When health drops below 40% of max, splits into two copies of the same unit with 25% max health, then dies.
status.raen-SplitC.name = Split-High
status.raen-SplitC.description = When health drops below 50% of max, splits into two copies of the same unit with 35% max health, then dies.

# ==================== Shared recovery ====================
status.raen-ShareA.name = Shared Recovery-Low
status.raen-ShareA.description = Every 5 seconds, remembers the nearest 3 allied units within 10 tiles and forms a group with itself. When any member takes damage, every other member recovers 2% of that damage (health and shield lost). When any member is healed by an outside source, every other member recovers 5% of that healing (only health gain counts, not shield gain). Recovery fills health first, then shield; if the target's own shield is already at 50% of its max health, this effect's recovery does nothing for it.
status.raen-ShareB.name = Shared Recovery-Mid
status.raen-ShareB.description = Every 5 seconds, remembers the nearest 5 allied units within 15 tiles and forms a group with itself. When any member takes damage, every other member recovers 4% of that damage (health and shield lost). When any member is healed by an outside source, every other member recovers 8% of that healing (only health gain counts, not shield gain). Recovery fills health first, then shield; if the target's own shield is already at 50% of its max health, this effect's recovery does nothing for it.
status.raen-ShareC.name = Shared Recovery-High
status.raen-ShareC.description = Every 5 seconds, remembers the nearest 7 allied units within 20 tiles and forms a group with itself. When any member takes damage, every other member recovers 6% of that damage (health and shield lost). When any member is healed by an outside source, every other member recovers 12% of that healing (only health gain counts, not shield gain). Recovery fills health first, then shield; if the target's own shield is already at 50% of its max health, this effect's recovery does nothing for it.

# ==================== Artillery ====================
status.raen-BulletSpawnArtillery.name = Artillery
status.raen-BulletSpawnArtillery.description = Periodically fires a volley of fragmenting artillery shells in a random direction.

# ==================== Ignite ====================
status.raen-Ignite.name = Ignite
status.raen-Ignite.description = Every 5 seconds, finds all hostile units and buildings within 3x this unit's collision size and starts a fire under each of them (the same ignition the vanilla incendiary turrets use, respecting the map's fire rule).

# ==================== Bullet orbit ====================
status.raen-BulletOrbit.name = Bullet Orbit
status.raen-BulletOrbit.description = Every 10 seconds, enters a 2.5 second control state. During it, hostile bullets within 2.5x this unit's collision size are seized: their ownership switches to this unit, their damage drops to 50%, and they orbit it at a fixed radius of 2x its collision size. Controlled bullets age at one third speed, so they do not expire mid-orbit; when the state ends they are flung at speed 5 toward the nearest hostile unit or building within 30 tiles (chosen by distance only), or straight ahead 30 tiles if no target exists.

# ==================== Bloodbath ====================
status.raen-BloodAtkA.name = Bloodbath: Damage-Low
status.raen-BloodAtkA.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: damage dealt scales with lost health from +0% up to +200%.
status.raen-BloodAtkB.name = Bloodbath: Damage-Mid
status.raen-BloodAtkB.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: damage dealt scales with lost health from +0% up to +300%.
status.raen-BloodAtkC.name = Bloodbath: Damage-High
status.raen-BloodAtkC.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: damage dealt scales with lost health from +0% up to +400%.
status.raen-BloodRateA.name = Bloodbath: Fire Rate-Low
status.raen-BloodRateA.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: fire rate scales with lost health from +0% up to +150%.
status.raen-BloodRateB.name = Bloodbath: Fire Rate-Mid
status.raen-BloodRateB.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: fire rate scales with lost health from +0% up to +210%.
status.raen-BloodRateC.name = Bloodbath: Fire Rate-High
status.raen-BloodRateC.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: fire rate scales with lost health from +0% up to +280%.
status.raen-BloodMoveA.name = Bloodbath: Move Speed-Low
status.raen-BloodMoveA.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: move speed scales with lost health from +0% up to +160%.
status.raen-BloodMoveB.name = Bloodbath: Move Speed-Mid
status.raen-BloodMoveB.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: move speed scales with lost health from +0% up to +230%.
status.raen-BloodMoveC.name = Bloodbath: Move Speed-High
status.raen-BloodMoveC.description = Activates after the unit opens fire. From then on it deals 1% of its current health to itself every second, and applies a 1 second buff: move speed scales with lost health from +0% up to +320%.

