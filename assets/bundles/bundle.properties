# Random Enhancement
# Default (fallback) bundle. Keys mirror bundle_zh_CN.properties.
#
# Key format: status.<modname>-<content name>.name / .description
#   Mindustry prepends "<modname>-" to every mod content name, see ContentLoader:
#       public String transformName(String name){
#           return currentMod == null ? name : currentMod.name + "-" + name;
#       }
#   This mod's name is "raen", hence status.raen-SpeedA.name - NOT status.SpeedA.name.
#   For the same reason sprite files are named without the prefix (SpeedA.png),
#   because the sprite packer adds it automatically.

# ==================== Settings UI ====================
raen.category = PVE Random Enhancement
raen.difficulty.off = Off
raen.difficulty.easy = Easy (x1.0)
raen.difficulty.hard = Hard (x2.0)
raen.difficulty.unknown = Unknown

