status.raen-NimbleA.name = Light Gear-Low
status.raen-NimbleA.description = Health multiplier drops to 60%, traded for 200% move speed and 125% fire rate.
status.raen-NimbleB.name = Light Gear-Mid
status.raen-NimbleB.description = Health multiplier drops to 40%, traded for 450% move speed and 150% fire rate.
status.raen-NimbleC.name = Light Gear-High
status.raen-NimbleC.description = Health multiplier drops to 20%, traded for 750% move speed and 175% fire rate.

# ==================== Heavy gear ====================
status.raen-HeavyArmorA.name = Heavy Gear-Low
status.raen-HeavyArmorA.description = Move speed drops to 60%, traded for 240% health and 150% damage.
status.raen-HeavyArmorB.name = Heavy Gear-Mid
status.raen-HeavyArmorB.description = Move speed drops to 35%, traded for 360% health and 200% damage.
status.raen-HeavyArmorC.name = Heavy Gear-High
status.raen-HeavyArmorC.description = Move speed drops to 15%, traded for 480% health and 250% damage.

# ==================== Scratcher ====================
status.raen-ScratcherA.name = Scratcher-Low
status.raen-ScratcherA.description = Damage multiplier drops to 52%, traded for 200% fire rate.
status.raen-ScratcherB.name = Scratcher-Mid
status.raen-ScratcherB.description = Damage multiplier drops to 36%, traded for 300% fire rate.
status.raen-ScratcherC.name = Scratcher-High
status.raen-ScratcherC.description = Damage multiplier drops to 29%, traded for 400% fire rate.

# ==================== Heavy hitter ====================
status.raen-MightyA.name = Heavy Hitter-Low
status.raen-MightyA.description = Fire rate drops to 60%, traded for a 200% damage multiplier.
status.raen-MightyB.name = Heavy Hitter-Mid
status.raen-MightyB.description = Fire rate drops to 35%, traded for a 375% damage multiplier.
status.raen-MightyC.name = Heavy Hitter-High
status.raen-MightyC.description = Fire rate drops to 10%, traded for a 1500% damage multiplier.

# ==================== Shadow ====================
status.raen-ShadowA.name = Shadow-Low
status.raen-ShadowA.description = Every 15 seconds, teleports to a random empty spot within 15 tiles. Each teleport restores 10 health plus 1% of the health already lost, filling health first and then shield; shield is capped at 50% of max health. If no empty spot is found in range, it does not teleport and only half of the restoration applies.
status.raen-ShadowB.name = Shadow-Mid
status.raen-ShadowB.description = Every 12 seconds, teleports to a random empty spot within 23 tiles. Each teleport restores 10 health plus 1% of the health already lost, filling health first and then shield; shield is capped at 50% of max health. If no empty spot is found in range, it does not teleport and only half of the restoration applies.
status.raen-ShadowC.name = Shadow-High
status.raen-ShadowC.description = Every 9 seconds, teleports to a random empty spot within 30 tiles. Each teleport restores 10 health plus 1% of the health already lost, filling health first and then shield; shield is capped at 50% of max health. If no empty spot is found in range, it does not teleport and only half of the restoration applies.

# ==================== Distortion ====================
status.raen-DistortA.name = Distortion-Low
status.raen-DistortA.description = The state lasts 1 second, then goes on a 15 second cooldown. Hostile bullets within 10 tiles are deflected in a random direction.
status.raen-DistortB.name = Distortion-Mid
status.raen-DistortB.description = The state lasts 1.5 seconds, then goes on a 12 second cooldown. Hostile bullets within 14 tiles are turned 180° ± 45° from their original heading.
status.raen-DistortC.name = Distortion-High
status.raen-DistortC.description = The state lasts 2 seconds, then goes on a 9 second cooldown. Hostile bullets within 18 tiles are reflected straight back along their original path.

# ==================== Salvage ====================
status.raen-SalvageA.name = Salvage-Low
status.raen-SalvageA.description = When a unit dies within 10 tiles, its weapons are queued (up to 5 entries). Only 1 set is in use at a time, each for 3 seconds; weapons without a projectile and suicide weapons are skipped.
status.raen-SalvageB.name = Salvage-Mid
status.raen-SalvageB.description = When a unit dies within 15 tiles, its weapons are queued (up to 7 entries). Up to 2 sets are in use at once, each for 4 seconds; weapons without a projectile and suicide weapons are skipped.
status.raen-SalvageC.name = Salvage-High
status.raen-SalvageC.description = When a unit dies within 20 tiles, its weapons are queued (up to 9 entries). Up to 3 sets are in use at once, each for 5 seconds; weapons without a projectile and suicide weapons are skipped.

# ==================== Marks ====================
status.raen-MarkRandomA.name = Mark Random-Low
status.raen-MarkRandomA.description = Friendly bullets within 6 tiles get 1 random tag.
status.raen-MarkRandomB.name = Mark Random-Mid
status.raen-MarkRandomB.description = Friendly bullets within 10 tiles get 2 random tags.
status.raen-MarkRandomC.name = Mark Random-High
status.raen-MarkRandomC.description = Friendly bullets within 14 tiles get 3 random tags.
status.raen-MarkFixedA.name = Mark Fixed-Low
status.raen-MarkFixedA.description = Rolls 1 tag from the pool when gained; from then on only that tag is applied to friendly bullets within 6 tiles.
status.raen-MarkFixedB.name = Mark Fixed-Mid
status.raen-MarkFixedB.description = Rolls 2 tags from the pool when gained; from then on only those tags are applied to friendly bullets within 10 tiles.
status.raen-MarkFixedC.name = Mark Fixed-High
status.raen-MarkFixedC.description = Rolls 3 tags from the pool when gained; from then on only those tags are applied to friendly bullets within 14 tiles.

# ==================== Offense ====================
status.raen-OffenseAtkA.name = Offense Damage-Low
status.raen-OffenseAtkA.description = While firing, gains a damage bonus from +0% to +100%; stopping fire resets it to zero. Move speed and health multipliers drop from 100% to 25% along with the bonus.
status.raen-OffenseAtkB.name = Offense Damage-Mid
status.raen-OffenseAtkB.description = While firing, gains a damage bonus from +0% to +300%; stopping fire resets it to zero. Move speed and health multipliers drop from 100% to 25% along with the bonus.
status.raen-OffenseAtkC.name = Offense Damage-High
status.raen-OffenseAtkC.description = While firing, gains a damage bonus from +0% to +500%; stopping fire resets it to zero. Move speed and health multipliers drop from 100% to 25% along with the bonus.
status.raen-OffenseRateA.name = Offense Rate-Low
status.raen-OffenseRateA.description = While firing, gains a fire-rate bonus from +0% to +100%. Stopping fire resets it to zero immediately. Move speed and health multipliers drop from 100% to 25% along with the bonus.
status.raen-OffenseRateB.name = Offense Rate-Mid
status.raen-OffenseRateB.description = While firing, gains a fire-rate bonus from +0% to +300%. Stopping fire resets it to zero immediately. Move speed and health multipliers drop from 100% to 25% along with the bonus.
status.raen-OffenseRateC.name = Offense Rate-High
status.raen-OffenseRateC.description = While firing, gains a fire-rate bonus from +0% to +500%. Stopping fire resets it to zero immediately. Move speed and health multipliers drop from 100% to 25% along with the bonus.

