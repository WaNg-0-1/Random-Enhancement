# Random Enhancement
# Default (fallback) bundle. Keys mirror bundle_zh_CN.properties.
#   status.<effect name>.name / .description  - read automatically by Mindustry, see UnlockableContent
#   raen.*                                    - used by this mod via Core.bundle.get()

# ==================== Settings UI ====================
raen.category = PVE Random Enhancement
raen.difficulty.off = Off
raen.difficulty.easy = Easy (x1.0)
raen.difficulty.hard = Hard (x2.0)
raen.difficulty.unknown = Unknown

# ==================== Stat buffs ====================
status.SpeedA.name = Speed-Low
status.SpeedA.description = Movement speed +12.5%.
status.SpeedB.name = Speed-Mid
status.SpeedB.description = Movement speed +25%.
status.SpeedC.name = Speed-High
status.SpeedC.description = Movement speed +50%.

status.HealthA.name = Health-Low
status.HealthA.description = Max health +12.5%.
status.HealthB.name = Health-Mid
status.HealthB.description = Max health +25%.
status.HealthC.name = Health-High
status.HealthC.description = Max health +50%.

status.DamageA.name = Damage-Low
status.DamageA.description = Damage dealt +12.5%.
status.DamageB.name = Damage-Mid
status.DamageB.description = Damage dealt +25%.
status.DamageC.name = Damage-High
status.DamageC.description = Damage dealt +50%.

status.ReloadA.name = Fire Rate-Low
status.ReloadA.description = Fire rate +12.5%.
status.ReloadB.name = Fire Rate-Mid
status.ReloadB.description = Fire rate +25%.
status.ReloadC.name = Fire Rate-High
status.ReloadC.description = Fire rate +50%.

# ==================== Damage reduction ====================
status.DamageReductionA.name = Damage Reduction-Low
status.DamageReductionA.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 25%. Lethal damage resolves first and cannot be restored.
status.DamageReductionB.name = Damage Reduction-Mid
status.DamageReductionB.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 50%. Lethal damage resolves first and cannot be restored.
status.DamageReductionC.name = Damage Reduction-High
status.DamageReductionC.description = Part of the health lost is restored. The lower the current health, the more is restored, up to 75%. Lethal damage resolves first and cannot be restored.

# ==================== Wingman ====================
status.GenerateWingmanA.name = Wingman-Low
status.GenerateWingmanA.description = Summons 1 wingman that orbits and fights, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.
status.GenerateWingmanB.name = Wingman-Mid
status.GenerateWingmanB.description = Summons 2 wingmen that orbit and fight, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.
status.GenerateWingmanC.name = Wingman-High
status.GenerateWingmanC.description = Summons 3 wingmen that orbit and fight, inheriting the host's weapons and abilities. One is replenished every 10 seconds, and the timer restarts whenever one is destroyed.

# ==================== Shared health ====================
status.TeamHealthA.name = Shared Health-Low
status.TeamHealthA.description = Joins the shared pool while health is above 75% of max. Members are levelled to the same health percentage, and shields are split evenly across the team. Drops out below the threshold.
status.TeamHealthB.name = Shared Health-Mid
status.TeamHealthB.description = Joins the shared pool while health is above 50% of max. Members are levelled to the same health percentage, and shields are split evenly across the team. Drops out below the threshold.
status.TeamHealthC.name = Shared Health-High
status.TeamHealthC.description = Joins the shared pool while health is above 1 point, which amounts to full sharing. Members are levelled to the same health percentage, and shields are split evenly across the team.

# ==================== Shield to health ====================
status.ShieldToHealthA.name = Shield to Health-Low
status.ShieldToHealthA.description = While shielded and below full health, consumes 36 shield per second to restore 20 health. Scales down when shield runs low and never overdrafts.
status.ShieldToHealthB.name = Shield to Health-Mid
status.ShieldToHealthB.description = While shielded and below full health, consumes 50 shield per second to restore 40 health. Scales down when shield runs low and never overdrafts.
status.ShieldToHealthC.name = Shield to Health-High
status.ShieldToHealthC.description = While shielded and below full health, consumes 60 shield per second to restore 60 health. Scales down when shield runs low and never overdrafts.

# ==================== Health to shield ====================
status.HealthToShieldA.name = Health to Shield-Low
status.HealthToShieldA.description = 10% of any health lost is converted into shield. Shield has no cap.
status.HealthToShieldB.name = Health to Shield-Mid
status.HealthToShieldB.description = 20% of any health lost is converted into shield. Shield has no cap.
status.HealthToShieldC.name = Health to Shield-High
status.HealthToShieldC.description = 30% of any health lost is converted into shield. Shield has no cap.

# ==================== Artillery ====================
status.BulletSpawnArtillery.name = Artillery
status.BulletSpawnArtillery.description = Periodically fires a volley of fragmenting artillery shells in a random direction.
