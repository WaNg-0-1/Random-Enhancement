# ==================== Tags (9 effects) ====================
# Keys: raen.tag.<short>.name / .title / .lN
#   .title = first line of the detail page ({0} = theme color)
#   .lN    = line N of the body; bullet markers ('  · ') and continuation indents are added in Java
# Shorts: zj Chase / pz Weak Point / jy Pyre / ss Acid Etch / zr Injection / zd Poison / dh Charge / zm Transfuse / ls Chain
raen.tag.zj.name = Chase
raen.tag.zj.title = [#{0}]Friendly bullets that hit a target gain 1 stack of [Chase] (no cap).
raen.tag.zj.l1 = Settles once every {0}s: a bullet is launched from the world origin (0,0) toward the marked target,
raen.tag.zj.l2 = dealing {0}-tile splash damage at the impact point:
raen.tag.zj.l3 = stacks ≤ {0}: consumes 1 stack, deals 1 damage
raen.tag.zj.l4 = stacks > {0}: consumes every stack above {0},
raen.tag.zj.l5 = dealing 1 + extra stacks × {0} damage (the bonus still counts as a single chase)
raen.tag.zj.l6 = bullet speed {0} px/frame, lifetime scaled by the distance to the target
raen.tag.zj.l7 = (a direct application counts as a hit for {0} damage)

raen.tag.pz.name = Weak Point
raen.tag.pz.title = [#{0}]When a friendly bullet hits a target (unit or building):
raen.tag.pz.l1 = {0}% chance to open the weak point,
raen.tag.pz.l2 = dealing bullet damage × current stacks × {0}% extra damage
raen.tag.pz.l3 = on a successful trigger, {0}% chance to add a stack
raen.tag.pz.l4 = (a stack equals the applied stack count, 1 by default; cap {0} stacks)
raen.tag.pz.l5 = at 0 stacks the trigger only stacks and deals no extra damage
raen.tag.pz.l6 = stacks last {0}s and are refreshed when stacked; after expiry, -1 stack every {1}s
raen.tag.pz.l7 = a direct application (no bullet) counts as a hit for {0} damage

raen.tag.jy.name = Pyre
raen.tag.jy.title = [#{0}]Friendly bullets pick up the [Pyre] mark as they pass through.
raen.tag.jy.l1 = Each hit on a target (unit or building) adds 1 stack of [Pyre] (no cap).
raen.tag.jy.l2 = Pyre effects (every {0}s):
raen.tag.jy.l3 = true damage [1 + stacks×{0}%]
raen.tag.jy.l4 = normal damage [1 + stacks×1/5000×target's current health×{0}%],
raen.tag.jy.l5 = doubled against shielded targets, plus shield × {0}% extra damage
raen.tag.jy.l6 = -1 stack
raen.tag.jy.l7 = at ≥2 stacks it scans {0} tiles and hands half of its stacks to
raen.tag.jy.l8 = one target without Pyre
raen.tag.jy.l9 = at ≥{0} stacks it also ignites the target, sets the ground on fire,
raen.tag.jy.l10 = and deals [stacks×{1}%] damage within {0} tiles (once per {2}s per target)
raen.tag.jy.l11 = When the target dies:
raen.tag.jy.l12 = {0}-tile blast for [stacks×{1}% + stacks×{2}×max health×{3}%] damage
raen.tag.jy.l13 = only Pyre targets of the victim's own team are chain-detonated (same formula),
raen.tag.jy.l14 = and both the blast and the chain only hurt the victim's team, never the applier

raen.tag.ss.name = Acid Etch
raen.tag.ss.title = [#{0}]Friendly bullets pick up the [Acid Etch] mark as they pass through:
raen.tag.ss.l1 = etched bullets deal {0}% less damage
raen.tag.ss.l2 = every hit applies the mark and +1 stack
raen.tag.ss.l3 = {0}% chance per hit to deal an extra {1}% bullet damage and +1 more stack
raen.tag.ss.l4 = at {0} stacks it detonates: {1}-tile blast for [stacks×bullet damage (unweakened)×{2}%] and clears the stacks
raen.tag.ss.l5 = at ≥{0} stacks, hits also roll a "stacks%" chance for mixed damage:
raen.tag.ss.l6 = [target's lost health × (0.1×stacks)%], capped at {0}% of the bullet's initial damage,
raen.tag.ss.l7 = {0}% of it as true damage and the rest as normal damage, plus +1 stack
raen.tag.ss.l8 = Poisoned targets also gain 1 poison stack. Units and buildings both accumulate stacks.

raen.tag.zr.name = Injection
raen.tag.zr.title = [#{0}]Friendly bullets apply the [Injection] mark on hit (+1 stack per hit, no hard cap).
raen.tag.zr.l1 = at {0} stacks the target enters a {1}s injection state:
raen.tag.zr.l2 = effective health (health + shield) is snapshotted on entry
raen.tag.zr.l3 = further hits during it: every stack above {0} adds {1} point to the blast
raen.tag.zr.l4 = on exit, blast = (entry effective health − exit effective health) + overflow stacks
raen.tag.zr.l5 = (capped at max health × {0}%)
raen.tag.zr.l6 = if the target dies during it: an immediate blast within {0} tiles
raen.tag.zr.l7 = after {0}s: detonates at the target and clears the stacks
raen.tag.zr.l8 = - radius {0}~{1} tiles
raen.tag.zr.l9 = - damage blast × {0}%~{1}%
raen.tag.zr.l10 = dying before {0} stacks: one {1}-tile blast for [stacks×{2}%].
raen.tag.zr.l11 = Works on units and buildings.

raen.tag.zd.name = Poison
raen.tag.zd.title = [#{0}]Friendly bullets pick up the poison mark as they pass: each hit adds 1 poison stack, no cap.
raen.tag.zd.l1 = poisoned targets take [stacks×{1}] damage + [stacks×{2}] true damage every {0}s, then lose 1 stack and are slowed by stack count.
raen.tag.zd.l2 = when a poisoned target dies it leaves a poison pool (inheriting the stacks at death, radius {0} tiles).
raen.tag.zd.l3 = [accent]Execution: each stack provides [lost health×{0}% + {1}] execution damage,
raen.tag.zd.l4 = the total is capped at [lost health×{0}%]; if current health is below it the target is killed outright.
raen.tag.zd.l5 = the execution threshold tops out near {0}% of max health; executions do not consume stacks.
raen.tag.zd.l6 = a pool holds stacks×{0} damage, and enemies inside consume it as they take damage.
raen.tag.zd.l7 = overlapping pools merge at the midpoint and add their stacks. A pool vanishes once its damage reaches zero.
raen.tag.zd.l8 = Units and buildings can both be poisoned.

raen.tag.dh.name = Charge
raen.tag.dh.title = [#{0}]Friendly bullets randomly pick up a positive or negative charge as they pass.
raen.tag.dh.l1 = same-polarity charges stack without limit.
raen.tag.dh.l2 = applying the opposite polarity:
raen.tag.dh.l3 = below {0} stacks: bullet {1}% damage ({2}-tile radius), -1 stack.
raen.tag.dh.l4 = [#ffaa00]at ≥{0} stacks: detonates every stack for
raen.tag.dh.l5 = [stacks×{0}%×bullet damage] true damage plus {1}% of it as {2}-tile splash,
raen.tag.dh.l6 = and spawns a {0}s magnetic field
raen.tag.dh.l7 = the field adds 1 same-polarity charge per second to every unit and building inside.
raen.tag.dh.l8 = same-polarity fields merge (timer reset); opposite fields annihilate, detonating every charge stack in range ({0} damage per stack) and clearing them,
raen.tag.dh.l9 = plus a health-proportional true damage hit (cap {0}).
raen.tag.dh.l10 = if the stacks stay unchanged for {0}s,
raen.tag.dh.l11 = they decay 1 per second, dealing [current stacks×{0}] fixed damage.
raen.tag.dh.l12 = Units and buildings can both carry a charge.

raen.tag.zm.name = Transfuse
raen.tag.zm.title = [#{0}]Friendly bullets pick up the [Transfuse] mark as they pass.
raen.tag.zm.l1 = each hit on an enemy unit adds 1 stack (cap {0}, buildings are unaffected),
raen.tag.zm.l2 = and refreshes the duration to {0}s;
raen.tag.zm.l3 = every {0}s it settles:
raen.tag.zm.l4 = draining current health×{0}%×stacks from the target
raen.tag.zm.l5 = {0}% of the drained amount becomes the target's own shield
raen.tag.zm.l6 = the mark disappears when the duration ends (stacks are cleared with it).

raen.tag.ls.name = Chain
raen.tag.ls.title = [#{0}]Friendly bullets pick up the [Chain] mark as they pass.
raen.tag.ls.l1 = +1 stack per hit (no cap).
raen.tag.ls.l2 = each hit has a ({0} + stacks)% chance to trigger chain lightning:
raen.tag.ls.l3 = chains {0} + stacks×{1}% targets
raen.tag.ls.l4 = damage = the triggering bullet's damage × ({0} + stacks)%
raen.tag.ls.l5 = jump search radius = {0} + stacks
raen.tag.ls.l6 = each jump decays to {0}% of the previous one
raen.tag.ls.l7 = the stacks are cleared after a trigger.
