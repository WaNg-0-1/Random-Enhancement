raen.item.sporepod.name = Spore Pod
raen.item.sporepod.effect = Adds stacks on hit and applies Spore Slowed for 5s; each stack gives a 1% chance to apply Sapped for 5 + stacks×0.1s, then clears stacks
raen.item.pyratite.name = Pyratite
raen.item.pyratite.effect = Applies Burning for 5s and ignites the hit point; if the target already has Flame, adds 1 more Flame stack
raen.item.blastcompound.name = Blast Compound
raen.item.blastcompound.effect = Applies Blasted and deals 5-tile splash damage equal to 1% of bullet damage; adds 1 Flame stack if the target already has Flame
raen.item.coal.name = Coal
