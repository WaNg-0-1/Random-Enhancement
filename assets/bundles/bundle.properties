raen.item.sand.name = Sand
raen.item.sand.effect = Applies Muddy for 3s and adds 1 stack; each stack gives a 1% chance to raise a temporary wall at the target (health 50+stacks, lasts 5+stacks×0.1s), then clears stacks
raen.item.scrap.name = Scrap
raen.item.scrap.effect = Adds a stack on hit (max 5); every 5s consumes 1 stack to apply Unmoving for 1s
raen.item.beryllium.name = Beryllium
