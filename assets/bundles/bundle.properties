# ==================== Heavy hitter ====================
status.raen-MightyA.name = Heavy Hitter-Low
status.raen-MightyA.description = Fire rate drops to 60%, traded for a 200% damage multiplier.
status.raen-MightyB.name = Heavy Hitter-Mid
status.raen-MightyB.description = Fire rate drops to 35%, traded for a 375% damage multiplier.
status.raen-MightyC.name = Heavy Hitter-High
status.raen-MightyC.description = Fire rate drops to 10%, traded for a 1500% damage multiplier.

# ==================== Shadow ====================
status.raen-ShadowA.name = Shadow-Low
status.raen-ShadowA.description = Every 15 seconds, teleports to a random empty spot within 15 tiles. Ground units need a tile with no block, no unit and no liquid floor (shallow water is fine); naval units need a liquid floor that does not deal damage over time (oil, slag, lava and the like); flying units only need no unit nearby. Each teleport restores 10 health plus 1% of the health already lost, filling health first and then shield; the restoration does nothing if the unit's shield already exceeds 50% of its max health. If no empty spot is found in range, it does not teleport and only half of the restoration applies.
status.raen-ShadowB.name = Shadow-Mid
status.raen-ShadowB.description = Every 12 seconds, teleports to a random empty spot within 23 tiles. Ground units need a tile with no block, no unit and no liquid floor (shallow water is fine); naval units need a liquid floor that does not deal damage over time (oil, slag, lava and the like); flying units only need no unit nearby. Each teleport restores 10 health plus 1% of the health already lost, filling health first and then shield; the restoration does nothing if the unit's shield already exceeds 50% of its max health. If no empty spot is found in range, it does not teleport and only half of the restoration applies.
status.raen-ShadowC.name = Shadow-High
status.raen-ShadowC.description = Every 9 seconds, teleports to a random empty spot within 30 tiles. Ground units need a tile with no block, no unit and no liquid floor (shallow water is fine); naval units need a liquid floor that does not deal damage over time (oil, slag, lava and the like); flying units only need no unit nearby. Each teleport restores 10 health plus 1% of the health already lost, filling health first and then shield; the restoration does nothing if the unit's shield already exceeds 50% of its max health. If no empty spot is found in range, it does not teleport and only half of the restoration applies.

# ==================== Distortion ====================
status.raen-DistortA.name = Distortion-Low
status.raen-DistortA.description = The state lasts 1 second, then goes on a 15 second cooldown. Hostile bullets within 10 tiles are seized: their team switches to this unit, their damage drops to 25%, their remaining lifetime is set to 50% of the maximum, and they are sent off in a random direction.
status.raen-DistortB.name = Distortion-Mid
status.raen-DistortB.description = The state lasts 1.5 seconds, then goes on a 12 second cooldown. Hostile bullets within 14 tiles are seized: their team switches to this unit, their damage drops to 50%, their remaining lifetime is set to 25% of the maximum, and they are turned 180° ± 45° from their original heading.
status.raen-DistortC.name = Distortion-High
status.raen-DistortC.description = The state lasts 2 seconds, then goes on a 9 second cooldown. Hostile bullets within 18 tiles are seized: their team switches to this unit, their damage drops to 75%, their remaining lifetime is reset to full, and they are reflected straight back along their original path.

# ==================== Salvage ====================
status.raen-SalvageA.name = Salvage-Low
status.raen-SalvageA.description = When any unit (friend or foe) dies within 10 tiles, its weapons are queued (up to 5 entries). Only 1 set is in use at a time, each for 3 seconds; units that die while it is in use wait in the queue and take over once the current set expires. Weapons without a projectile (repair beams and the like) and suicide weapons (whose bullet has killShooter, such as crawlers) are skipped.
status.raen-SalvageB.name = Salvage-Mid
status.raen-SalvageB.description = When any unit (friend or foe) dies within 15 tiles, its weapons are queued (up to 7 entries). Up to 2 sets are in use at once, each for 4 seconds; units that die while the slots are full wait in the queue and take over when a slot frees up. Weapons without a projectile (repair beams and the like) and suicide weapons (whose bullet has killShooter, such as crawlers) are skipped.
status.raen-SalvageC.name = Salvage-High
status.raen-SalvageC.description = When any unit (friend or foe) dies within 20 tiles, its weapons are queued (up to 9 entries). Up to 3 sets are in use at once, each for 5 seconds; units that die while the slots are full wait in the queue and take over when a slot frees up. Weapons without a projectile (repair beams and the like) and suicide weapons (whose bullet has killShooter, such as crawlers) are skipped.
