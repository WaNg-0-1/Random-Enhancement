raen.item.titanium.name = Titanium
raen.item.titanium.effect = Bullet damage +5 and +5%, plus knockback equal to 10% of bullet damage
raen.item.thorium.name = Thorium
raen.item.thorium.effect = Bullet damage +7 and +10%, plus extra damage equal to 30% of the target armor
raen.item.silicon.name = Silicon
raen.item.silicon.effect = Bullet homes within 24 tiles
raen.item.metaglass.name = Metaglass
raen.item.metaglass.effect = 0.5s after gaining the tag, spawns a 3%-damage shard at that spot: it inherits the bullet's tags but drops glass/lead/plastanium/surge-alloy (no extra shards or lightning), and homes within 12 tiles
raen.item.graphite.name = Graphite
