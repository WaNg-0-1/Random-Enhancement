status.raen-GlassCannonB.name = Glass Cannon-Mid
status.raen-GlassCannonB.description = Health multiplier drops to 30%, but damage multiplier rises to 600%.
status.raen-GlassCannonC.name = Glass Cannon-High
status.raen-GlassCannonC.description = Health multiplier drops to 10%, but damage multiplier rises to 1000%.

