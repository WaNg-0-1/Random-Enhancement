# ==================== Wingman ====================
status.raen-GenerateWingmanA.name = Wingman-Low
status.raen-GenerateWingmanA.description = Summons 1 wingman that orbits and fights, inheriting the host's weapons and abilities. Replenished every 10 seconds.
status.raen-GenerateWingmanB.name = Wingman-Mid
status.raen-GenerateWingmanB.description = Summons 2 wingmen that orbit and fight, inheriting the host's weapons and abilities. Replenished every 10 seconds.
status.raen-GenerateWingmanC.name = Wingman-High
