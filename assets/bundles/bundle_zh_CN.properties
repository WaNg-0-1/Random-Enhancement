# ==================== 共血 ====================
status.TeamHealthA.name = 共血-低级
status.TeamHealthA.description = 血量高于最大生命的 75% 时加入共享队伍。队内成员血量会被拉平到同一百分比，护盾由全队平分；跌破门槛自动退队。
status.TeamHealthB.name = 共血-中级
status.TeamHealthB.description = 血量高于最大生命的 50% 时加入共享队伍。队内成员血量会被拉平到同一百分比，护盾由全队平分；跌破门槛自动退队。
status.TeamHealthC.name = 共血-高级
status.TeamHealthC.description = 血量高于 1 点即可加入共享队伍，等于全员共享。队内成员血量会被拉平到同一百分比，护盾由全队平分。

