# ==================== 共血 ====================
status.raen-TeamHealthA.name = 共血-低级
status.raen-TeamHealthA.description = 血量高于最大生命的 75% 时加入共享队伍。队内成员血量会被拉平到同一百分比，护盾由全队平分；跌破门槛自动退队。
status.raen-TeamHealthB.name = 共血-中级
status.raen-TeamHealthB.description = 血量高于最大生命的 50% 时加入共享队伍。队内成员血量会被拉平到同一百分比，护盾由全队平分；跌破门槛自动退队。
status.raen-TeamHealthC.name = 共血-高级
status.raen-TeamHealthC.description = 血量高于 1 点即可加入共享队伍，等于全员共享。队内成员血量会被拉平到同一百分比，护盾由全队平分。

# ==================== 盾转血 ====================
status.raen-ShieldToHealthA.name = 盾转血-低级
status.raen-ShieldToHealthA.description = 有护盾且血量不满时持续生效：每秒消耗 36 点护盾换取 20 点生命。
status.raen-ShieldToHealthB.name = 盾转血-中级
status.raen-ShieldToHealthB.description = 有护盾且血量不满时持续生效：每秒消耗 50 点护盾换取 40 点生命。
status.raen-ShieldToHealthC.name = 盾转血-高级
status.raen-ShieldToHealthC.description = 有护盾且血量不满时持续生效：每秒消耗 60 点护盾换取 60 点生命。

# ==================== 血转盾 ====================
status.raen-HealthToShieldA.name = 血转盾-低级
status.raen-HealthToShieldA.description = 血量被削减时，其中 10% 转化为护盾。
status.raen-HealthToShieldB.name = 血转盾-中级
status.raen-HealthToShieldB.description = 血量被削减时，其中 20% 转化为护盾。
status.raen-HealthToShieldC.name = 血转盾-高级
status.raen-HealthToShieldC.description = 血量被削减时，其中 30% 转化为护盾。

# ==================== 反伤 ====================
status.raen-ReflectA.name = 反伤-低级
status.raen-ReflectA.description = 血量被削减时，把掉血量的一部分打回 18 格内最近的敌方目标：满血 10%，濒死升到 45%。9 格以内满额，到 18 格边缘衰减为一半。
status.raen-ReflectB.name = 反伤-中级
status.raen-ReflectB.description = 血量被削减时，把掉血量的一部分打回 24 格内最近的敌方目标：满血 20%，濒死升到 60%。12 格以内满额，到 24 格边缘衰减为一半。
status.raen-ReflectC.name = 反伤-高级
status.raen-ReflectC.description = 血量被削减时，把掉血量的一部分打回 30 格内最近的敌方目标：满血 30%，濒死升到 75%。15 格以内满额，到 30 格边缘衰减为一半。

# ==================== 短时爆发 ====================
status.raen-LinkBurstA.name = 短时爆发-低级
status.raen-LinkBurstA.description = 每 18 秒连接 13 格内 1 个敌方目标（单位优先于建筑，同类中血量高者优先），持续 3 秒。连接期间自身每损失 1 点生命或护盾，就对其造成 0.75 点伤害。
status.raen-LinkBurstB.name = 短时爆发-中级
status.raen-LinkBurstB.description = 每 14 秒连接 17 格内 2 个敌方目标（单位优先于建筑，同类中血量高者优先），持续 4 秒。连接期间自身每损失 1 点生命或护盾，就对其造成 1.75 点伤害，由目标平分。
status.raen-LinkBurstC.name = 短时爆发-高级
status.raen-LinkBurstC.description = 每 10 秒连接 21 格内 3 个敌方目标（单位优先于建筑，同类中血量高者优先），持续 5 秒。连接期间自身每损失 1 点生命或护盾，就对其造成 3 点伤害，由目标平分。

# ==================== 血量转移 ====================
status.raen-LinkTransferA.name = 血量转移-低级
status.raen-LinkTransferA.description = 同时连接 13 格内 1 个敌方（单位优先于建筑）与 1 个己方单位。敌方每损失 1 点生命或护盾，就按 75% 化为治疗平分给连接的己方；建筑没有护盾，只计掉血。治疗优先补血，血满后补盾且不超过最大生命值。自身与己方的损失不会反馈给敌方。
status.raen-LinkTransferB.name = 血量转移-中级
status.raen-LinkTransferB.description = 同时连接 17 格内 2 个敌方（单位优先于建筑）与 2 个己方单位。敌方每损失 1 点生命或护盾，就按 100% 化为治疗平分给连接的己方；建筑没有护盾，只计掉血。治疗优先补血，血满后补盾且不超过最大生命值。自身与己方的损失不会反馈给敌方。
status.raen-LinkTransferC.name = 血量转移-高级
status.raen-LinkTransferC.description = 同时连接 21 格内 3 个敌方（单位优先于建筑）与 2 个己方单位。敌方每损失 1 点生命或护盾，就按 125% 化为治疗平分给连接的己方；建筑没有护盾，只计掉血。治疗优先补血，血满后补盾且不超过最大生命值。自身与己方的损失不会反馈给敌方。

# ==================== 分裂 ====================
status.raen-SplitA.name = 分裂-低级
status.raen-SplitA.description = 血量低于最大生命的 30% 时，分裂成两个继承 15% 最大生命的自身单位，随后自身死亡。
status.raen-SplitB.name = 分裂-中级
status.raen-SplitB.description = 血量低于最大生命的 40% 时，分裂成两个继承 25% 最大生命的自身单位，随后自身死亡。
status.raen-SplitC.name = 分裂-高级
status.raen-SplitC.description = 血量低于最大生命的 50% 时，分裂成两个继承 35% 最大生命的自身单位，随后自身死亡。

# ==================== 共享回复 ====================
status.raen-ShareA.name = 共享回复-低级
status.raen-ShareA.description = 每 5 秒记住 10 格内最近的 3 个己方单位，与自身组成一个组。组内任一成员受伤时，除受伤者之外的成员回复该次伤害（掉血 + 掉盾）的 2%；组内任一成员被外部治疗时，除被治疗者之外的成员回复该次治疗的 5%（只认血量增加，盾值增加不算）。回复优先补血、血满补盾；若目标自身护盾已达自身最大生命的 50%，本效果对它的回复无效。
status.raen-ShareB.name = 共享回复-中级
status.raen-ShareB.description = 每 5 秒记住 15 格内最近的 5 个己方单位，与自身组成一个组。组内任一成员受伤时，除受伤者之外的成员回复该次伤害（掉血 + 掉盾）的 4%；组内任一成员被外部治疗时，除被治疗者之外的成员回复该次治疗的 8%（只认血量增加，盾值增加不算）。回复优先补血、血满补盾；若目标自身护盾已达自身最大生命的 50%，本效果对它的回复无效。
status.raen-ShareC.name = 共享回复-高级
status.raen-ShareC.description = 每 5 秒记住 20 格内最近的 7 个己方单位，与自身组成一个组。组内任一成员受伤时，除受伤者之外的成员回复该次伤害（掉血 + 掉盾）的 6%；组内任一成员被外部治疗时，除被治疗者之外的成员回复该次治疗的 12%（只认血量增加，盾值增加不算）。回复优先补血、血满补盾；若目标自身护盾已达自身最大生命的 50%，本效果对它的回复无效。

# ==================== 炮击 ====================
status.raen-BulletSpawnArtillery.name = 炮击
status.raen-BulletSpawnArtillery.description = 定期向随机方向发射一轮会分裂爆炸的炮击弹。

# ==================== 点燃 ====================
status.raen-Ignite.name = 点燃
status.raen-Ignite.description = 每 5 秒在自身 3 倍碰撞体积的范围内找出所有敌方单位与敌方建筑，在每一个目标脚下点燃一处火焰（与炮台燃烧弹相同的点燃方式，遵守地图的火焰规则）。

# ==================== 弹幕环绕 ====================
status.raen-BulletOrbit.name = 弹幕环绕
status.raen-BulletOrbit.description = 每 10 秒进入持续 2.5 秒的控制状态。期间把自身 2.5 倍碰撞体积内的敌方子弹抢过来：归属改为自己、伤害降为 50%，并让它们以 2 倍碰撞体积为半径环绕自身。被控制的子弹时间流速变为三分之一，不会在环绕中自然消失；状态结束后会被甩出去：以 5 的速度射向 30 格内最近的敌方单位或建筑（只按距离选）；若没有目标，则射向自身正前方 30 格处。

