# ==================== 标签（9 个效果） ====================
# 命名：raen.tag.<短名>.name / .title / .lN
#   .title = 详情页第一行（{0} = 主题色）
#   .lN    = 第 N 行正文；项目符号「  · 」与续行缩进由 Java 侧拼接，这里不要写前导空格
# 短名：zj 追击 / pz 破绽 / jy 积焰 / ss 酸蚀 / zr 注入 / zd 中毒 / dh 电荷 / zm 转命 / ls 连锁
raen.tag.zj.name = 追击
raen.tag.zj.title = [#{0}]己方子弹命中目标时施加 1 层[追击]（无上限）。
raen.tag.zj.l1 = 每 {0} 秒结算一次：从世界原点 (0,0) 发射一枚子弹飞向被标记者，
raen.tag.zj.l2 = 命中后在目标处造成 {0} 格范围伤害：
raen.tag.zj.l3 = 层数 ≤ {0}：消耗 1 层，造成 1 伤害
raen.tag.zj.l4 = 层数 > {0}：消耗「超过 {0}」的全部层数，
raen.tag.zj.l5 = 造成 1 + 额外层数 × {0} 伤害（强化只算 1 次追击）
raen.tag.zj.l6 = 子弹速度 {0} 像素/帧，按目标距离换算存活时间
raen.tag.zj.l7 = （直接施加视为一次 {0} 伤害的命中）

raen.tag.pz.name = 破绽
raen.tag.pz.title = [#{0}]己方子弹命中目标（单位或建筑）时：
raen.tag.pz.l1 = 有 {0}% 概率触发破绽，
raen.tag.pz.l2 = 造成 子弹伤害 × 当前层数 × {0}% 的额外伤害
raen.tag.pz.l3 = 触发破绽时，有 {0}% 概率叠层
raen.tag.pz.l4 = （每层 = 施加的层数，默认 1 层；上限 {0} 层）
raen.tag.pz.l5 = 层数为 0 时触发只叠层
raen.tag.pz.l6 = 层数持续 {0} 秒，叠层时刷新时长；到期后每 {1} 秒 -1 层
raen.tag.pz.l7 = 直接施加视为一次 {0} 伤害的命中

raen.tag.jy.name = 积焰
raen.tag.jy.title = [#{0}]己方子弹经过后附加[积焰]印记。
raen.tag.jy.l1 = 命中目标时施加 1 层[积焰]（无上限）。
raen.tag.jy.l2 = 积焰效果（每 {0} 秒触发）：
raen.tag.jy.l3 = 真实伤害 [1 + 层数×{0}%]
raen.tag.jy.l4 = 普通伤害 [1 + 层数×1/5000×目标当前生命×{0}%]，
raen.tag.jy.l5 = 目标有护盾时翻倍，并额外附带护盾值×{0}% 的伤害
raen.tag.jy.l6 = 层数 -1
raen.tag.jy.l7 = 层数≥2 时，检测 {0} 格范围，将自身一半层数分给
raen.tag.jy.l8 = 一个无积焰的目标
raen.tag.jy.l9 = 层数≥{0} 时额外引燃目标、在目标处点燃地面，
raen.tag.jy.l10 = 并造成 {0} 格范围 [层数×{1}%] 伤害（同一目标每 {2} 秒最多一次）
raen.tag.jy.l11 = 目标死亡时：
raen.tag.jy.l12 = {0} 格范围造成 [层数×{1}% + 层数×{2}×目标最大生命×{3}%] 伤害
raen.tag.jy.l13 = 只引爆范围内【与死者同阵营】的积焰目标，
raen.tag.jy.l14 = 爆炸与连锁都只伤害死者自己所属的阵营，

raen.tag.ss.name = 酸蚀
raen.tag.ss.title = [#{0}]己方子弹经过后附加[酸蚀]印记：
raen.tag.ss.l1 = 附带酸蚀的子弹伤害降低 {0}%
raen.tag.ss.l2 = 命中时施加印记并 +1 层
raen.tag.ss.l3 = 每次命中有 {0}% 几率额外造成 {1}% 子弹伤害，并额外 +1 层
raen.tag.ss.l4 = 叠满 {0} 层引爆：造成 {1} 格范围、[层数×子弹伤害(未弱化)×{2}%] 伤害并清空层数
raen.tag.ss.l5 = 层数 ≥ {0} 时，命中时额外按「层数%」几率附带混伤：
