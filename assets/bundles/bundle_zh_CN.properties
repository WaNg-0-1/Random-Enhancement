# ==================== 回魂 ====================
status.raen-DamageReductionA.name = 回魂-低级
status.raen-DamageReductionA.description = 被削减的血量会按比例回补，当前血量越低回补越多，最多返还 25%。致死伤害结算在前，无法回补。
status.raen-DamageReductionB.name = 回魂-中级
status.raen-DamageReductionB.description = 被削减的血量会按比例回补，当前血量越低回补越多，最多返还 50%。致死伤害结算在前，无法回补。
status.raen-DamageReductionC.name = 回魂-高级
status.raen-DamageReductionC.description = 被削减的血量会按比例回补，当前血量越低回补越多，最多返还 75%。致死伤害结算在前，无法回补。

# ==================== 僚机 ====================
status.raen-GenerateWingmanA.name = 僚机-低级
status.raen-GenerateWingmanA.description = 召唤 1 架僚机环绕作战，继承宿主的武器与能力。每 10 秒补充一架，被击毁后重新计时。
status.raen-GenerateWingmanB.name = 僚机-中级
status.raen-GenerateWingmanB.description = 召唤 2 架僚机环绕作战，继承宿主的武器与能力。每 10 秒补充一架，被击毁后重新计时。
status.raen-GenerateWingmanC.name = 僚机-高级
