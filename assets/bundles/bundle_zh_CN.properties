# ==================== 势大力沉 ====================
status.raen-MightyA.name = 势大力沉-低级
status.raen-MightyA.description = 开火速度降到 60%，换取伤害倍率 200%。
status.raen-MightyB.name = 势大力沉-中级
status.raen-MightyB.description = 开火速度降到 35%，换取伤害倍率 375%。
status.raen-MightyC.name = 势大力沉-高级
status.raen-MightyC.description = 开火速度降到 10%，换取伤害倍率 1500%。

# ==================== 幽影 ====================
status.raen-ShadowA.name = 幽影-低级
status.raen-ShadowA.description = 每 15 秒随机传送到 15 格内的空地。每次传送回复 10 点生命加上已损失生命的 1%，优先回血、血满补盾；盾量不超过最大生命值的50%。范围内无空地则不传送，只生效一半的回复。
status.raen-ShadowB.name = 幽影-中级
status.raen-ShadowB.description = 每 12 秒随机传送到 23 格内的空地。每次传送回复 10 点生命加上已损失生命的 1%，优先回血、血满补盾；盾量不超过最大生命值的50%。范围内无空地则不传送，只生效一半的回复。
status.raen-ShadowC.name = 幽影-高级
status.raen-ShadowC.description = 每 9 秒随机传送到 30 格内的空地。每次传送回复 10 点生命加上已损失生命的 1%，优先回血、血满补盾；盾量不超过最大生命值的50%。范围内无空地则不传送，只生效一半的回复。

# ==================== 扭曲 ====================
status.raen-DistortA.name = 扭曲-低级
status.raen-DistortA.description = 生效持续 1 秒，结束后冷却 15 秒。对 10 格内的敌方子弹施加随机方向偏转。
status.raen-DistortB.name = 扭曲-中级
status.raen-DistortB.description = 生效持续 1.5 秒，结束后冷却 12 秒。对 14 格内的敌方子弹施加 180° ± 45° 偏转。
status.raen-DistortC.name = 扭曲-高级
status.raen-DistortC.description = 生效持续 2 秒，结束后冷却 9 秒。将 18 格内的敌方子弹原路反弹。

# ==================== 回收 ====================
status.raen-SalvageA.name = 回收-低级
status.raen-SalvageA.description = 10 格内有单位死亡时，把它的武器收入队列（最多存 5 个）。同一时间只有 1 组在用，每组使用 3 秒；没有弹丸的武器与自杀式武器会被跳过。
status.raen-SalvageB.name = 回收-中级
status.raen-SalvageB.description = 15 格内有单位死亡时，把它的武器收入队列（最多存 7 个）。同一时间最多 2 组同时使用，每组使用 4 秒；没有弹丸的武器与自杀式武器会被跳过。
status.raen-SalvageC.name = 回收-高级
status.raen-SalvageC.description = 20 格内有单位死亡时，把它的武器收入队列（最多存 9 个）。同一时间最多 3 组同时使用，每组使用 5 秒；没有弹丸的武器与自杀式武器会被跳过。

# ==================== 标印 ====================
