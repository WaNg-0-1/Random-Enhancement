# Random Enhancement / 随机强化
# 中文文本。
#
# 【key 命名规则】务必注意前缀：
#   status.<模组名>-<效果内部名>.name / .description
#   Mindustry 会给模组内容名自动加上 "<模组名>-"，见 ContentLoader：
#       public String transformName(String name){
#           return currentMod == null ? name : currentMod.name + "-" + name;
#       }
#   本模组 name 是 raen，所以必须写 status.raen-SpeedA.name，写成 status.SpeedA.name 匹配不上。
#   同理，贴图文件名要用不带前缀的 SpeedA.png —— 打包时会自动变成 raen-SpeedA。
#
#   raen.*  —— 本模组自己用 Core.bundle.get() 取的 UI 文本
unit.raen-wingmanA.name = 僚机
