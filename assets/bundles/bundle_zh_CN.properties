raen.tag.ss.l7 = 其中 {0}% 为真实伤害、其余为普通伤害，并额外 +1 层
raen.tag.ss.l8 = 目标中毒时会同步叠加 1 层中毒。单位与建筑都会积累层数。

raen.tag.zr.name = 注入
raen.tag.zr.title = [#{0}]己方子弹命中时附加[注入]印记（每命中 +1 层，无硬上限）。
raen.tag.zr.l1 = 满 {0} 层后进入 {1} 秒注入状态：
raen.tag.zr.l2 = 进入时快照目标有效血量（生命 + 护盾）
raen.tag.zr.l3 = 期间继续命中：超出 {0} 层的每 1 层直接 +{1} 点计入 爆炸
raen.tag.zr.l4 = 结束统计  爆炸 = (进入有效血量 − 结束有效血量) + 溢出层数折算
raen.tag.zr.l5 = （最大不超过 目标最大生命 × {0}%）
raen.tag.zr.l6 = 期间目标死亡：立即在 {0} 格范围造成 爆炸 伤害
raen.tag.zr.l7 = {0} 秒后：在目标处引爆并清空层数
raen.tag.zr.l8 = - 半径 {0}~{1} 格
raen.tag.zr.l9 = - 伤害 爆炸 × {0}%~{1}%
raen.tag.zr.l10 = 未满 {0} 层就死亡：造成一次 {1} 格范围、[层数×{2}%] 伤害。
raen.tag.zr.l11 = 作用于单位与建筑。

raen.tag.zd.name = 中毒
raen.tag.zd.title = [#{0}]己方子弹经过后附加中毒印记：命中目标时叠加 1 层毒，无上限。
raen.tag.zd.l1 = 中毒目标每 {0} 秒受到 [层数×{1}] 伤害 + [层数×{2}] 真实伤害，随后层数 -1，并按层数降低移动速度。
raen.tag.zd.l2 = 中毒目标死亡时，在原地生成毒圈（继承死亡时层数，半径 {0} 格）。
raen.tag.zd.l3 = [accent]处决：每层提供 [已损失生命×{0}% + {1} 点] 的斩杀伤害，
raen.tag.zd.l4 = 最大不超过 [已损失生命×{0}%]；当前血量低于斩杀伤害时直接击杀。
raen.tag.zd.l5 = 斩杀线最高约 {0}% 最大生命值；斩杀不消耗层数。
raen.tag.zd.l6 = 毒圈可造成 层数×{0}，范围内敌人受到伤害时等量扣除伤害量。
raen.tag.zd.l7 = 毒圈重合时会在连线中点合并，层数叠加。伤害归零后消失。
raen.tag.zd.l8 = 单位与建筑都会中毒。

raen.tag.dh.name = 电荷
raen.tag.dh.title = [#{0}]己方子弹经过后随机附加正/负电荷。
raen.tag.dh.l1 = 同种电荷叠加无上限。
raen.tag.dh.l2 = 施加相反电荷时：
raen.tag.dh.l3 = 层数 < {0}：造成子弹{1}%伤害({2} 格范围)，层数 -1。
raen.tag.dh.l4 = [#ffaa00]层数 ≥ {0}：引爆全部层数，造成
raen.tag.dh.l5 = [层数×{0}%×子弹伤害]真实伤害 + 其 {1}% 的 {2} 格范围伤害，
raen.tag.dh.l6 = 并生成 {0} 秒磁爆场。
raen.tag.dh.l7 = 磁爆场每秒给范围内所有单位与建筑施加 1 层同种电荷。
raen.tag.dh.l8 = 同极磁爆场合并(时间重置)；异极磁爆场湮灭时，引爆范围内所有目标身上的电荷层数（每层 {0} 伤害）并清空，
raen.tag.dh.l9 = 同时造成生命比例真实伤害（上限 {0}）。
raen.tag.dh.l10 = 若层数在 {0} 秒内没有变化，
raen.tag.dh.l11 = 则开始每秒 -1 层，并造成 [当前层数×{0}] 点固定伤害。
raen.tag.dh.l12 = 单位与建筑都可以带电。

raen.tag.zm.name = 转命
raen.tag.zm.title = [#{0}]己方子弹经过后附加[转命]印记。
raen.tag.zm.l1 = 命中敌方单位时施加 1 层（上限 {0} 层，对建筑无效），
raen.tag.zm.l2 = 并把持续时间刷新为 {0} 秒；
raen.tag.zm.l3 = 期间每 {0} 秒结算一次：
raen.tag.zm.l4 = 扣除目标 当前生命值×{0}%×层数 的血量
raen.tag.zm.l5 = 扣除量的 {0}% 转化为目标自身的护盾
raen.tag.zm.l6 = 持续时间结束时印记消失（层数一并清空）。

raen.tag.ls.name = 连锁
raen.tag.ls.title = [#{0}]己方子弹经过后附加[连锁]印记。
raen.tag.ls.l1 = 每次命中 +1 层（无上限）。
raen.tag.ls.l2 = 命中时有 ({0} + 层数)% 的概率触发连锁闪电：
raen.tag.ls.l3 = 连锁 {0} + 层数×{1}% 个目标
raen.tag.ls.l4 = 伤害 = 触发连锁的子弹伤害 × ({0} + 层数)%
raen.tag.ls.l5 = 跳跃搜索半径 = {0} + 层数
raen.tag.ls.l6 = 每跳伤害衰减为上一跳的 {0}%
raen.tag.ls.l7 = 触发后清空该目标的层数。
