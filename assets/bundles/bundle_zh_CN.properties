raen.block.panel.liquidInfo = [lightgray]液体：[white]{0}[lightgray] 种（每 {1} 单位挂一次标签，随机挂载；不提供四属性）
raen.block.panel.guaranteed = [lightgray]必带物品（只能选 1 种：选中的必然附带，其余名额随机）。每发能带 {0} 种以上物品标签时解锁。
raen.block.panel.guaranteedNone = [lightgray]未选择（全部物品随机挂载）
raen.block.panel.guaranteedClear = [lightgray]清除选择（恢复为全部物品随机挂载）
