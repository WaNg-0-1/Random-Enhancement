# ==================== 幽影 ====================
status.raen-ShadowA.name = 幽影-低级
status.raen-ShadowA.description = 每 15 秒随机传送到 15 格内的空地。陆军要求该格没有方块、没有单位、地面不是液体（浅滩除外）；海军要求是水面且该格不会持续掉血（石油 / 矿渣 / 岩浆等）；空军只要求该格附近没有单位。每次传送回复 10 点生命加上已损失生命的 1%，优先补血、血满转盾；自身护盾已超过最大生命 50% 时本次回复不生效。若范围内找不到空地则不传送，只生效一半的回复。
status.raen-ShadowB.name = 幽影-中级
status.raen-ShadowB.description = 每 12 秒随机传送到 23 格内的空地。陆军要求该格没有方块、没有单位、地面不是液体（浅滩除外）；海军要求是水面且该格不会持续掉血（石油 / 矿渣 / 岩浆等）；空军只要求该格附近没有单位。每次传送回复 10 点生命加上已损失生命的 1%，优先补血、血满转盾；自身护盾已超过最大生命 50% 时本次回复不生效。若范围内找不到空地则不传送，只生效一半的回复。
status.raen-ShadowC.name = 幽影-高级
status.raen-ShadowC.description = 每 9 秒随机传送到 30 格内的空地。陆军要求该格没有方块、没有单位、地面不是液体（浅滩除外）；海军要求是水面且该格不会持续掉血（石油 / 矿渣 / 岩浆等）；空军只要求该格附近没有单位。每次传送回复 10 点生命加上已损失生命的 1%，优先补血、血满转盾；自身护盾已超过最大生命 50% 时本次回复不生效。若范围内找不到空地则不传送，只生效一半的回复。

# ==================== 扭曲 ====================
status.raen-DistortA.name = 扭曲-低级
status.raen-DistortA.description = 生效持续 1 秒，结束后冷却 15 秒。期间把 10 格内的敌方子弹抢过来：队伍改为自己、伤害降到 25%、剩余寿命设为最大寿命的 50%，并朝随机方向偏转。
status.raen-DistortB.name = 扭曲-中级
status.raen-DistortB.description = 生效持续 1.5 秒，结束后冷却 12 秒。期间把 14 格内的敌方子弹抢过来：队伍改为自己、伤害降到 50%、剩余寿命设为最大寿命的 25%，并朝原方向 180° ± 45° 偏转。
status.raen-DistortC.name = 扭曲-高级
status.raen-DistortC.description = 生效持续 2 秒，结束后冷却 9 秒。期间把 18 格内的敌方子弹抢过来：队伍改为自己、伤害降到 75%、剩余寿命重置为满，并沿原路 180° 反弹回去。

# ==================== 回收 ====================
status.raen-SalvageA.name = 回收-低级
status.raen-SalvageA.description = 10 格内有单位死亡时（不分敌我），把它的武器收入队列（最多存 5 个）。同一时间只有 1 组在用，每组使用 3 秒；使用期间新死亡的单位会排队，等当前这组用完再顶上。没有弹丸的武器（维修光束等）与自杀式武器（弹丸带「杀死开火者」，如爬虫）会被跳过。
status.raen-SalvageB.name = 回收-中级
status.raen-SalvageB.description = 15 格内有单位死亡时（不分敌我），把它的武器收入队列（最多存 7 个）。同一时间最多 2 组同时使用，每组使用 4 秒；使用期间新死亡的单位会排队，等有名额空出再顶上。没有弹丸的武器（维修光束等）与自杀式武器（弹丸带「杀死开火者」，如爬虫）会被跳过。
status.raen-SalvageC.name = 回收-高级
status.raen-SalvageC.description = 20 格内有单位死亡时（不分敌我），把它的武器收入队列（最多存 9 个）。同一时间最多 3 组同时使用，每组使用 5 秒；使用期间新死亡的单位会排队，等有名额空出再顶上。没有弹丸的武器（维修光束等）与自杀式武器（弹丸带「杀死开火者」，如爬虫）会被跳过。
