status.raen-ShieldToHealthA.description = 有护盾且血量不满时持续生效：每秒消耗 36 点护盾换取 20 点生命。
status.raen-ShieldToHealthB.name = 盾转血-中级
status.raen-ShieldToHealthB.description = 有护盾且血量不满时持续生效：每秒消耗 50 点护盾换取 40 点生命。
status.raen-ShieldToHealthC.name = 盾转血-高级
status.raen-ShieldToHealthC.description = 有护盾且血量不满时持续生效：每秒消耗 60 点护盾换取 60 点生命。

# ==================== 血转盾 ====================
status.raen-HealthToShieldA.name = 血转盾-低级
status.raen-HealthToShieldA.description = 血量被削减时，其中 10% 转化为护盾。
status.raen-HealthToShieldB.name = 血转盾-中级
status.raen-HealthToShieldB.description = 血量被削减时，其中 20% 转化为护盾。
status.raen-HealthToShieldC.name = 血转盾-高级
status.raen-HealthToShieldC.description = 血量被削减时，其中 30% 转化为护盾。

# ==================== 反伤 ====================
status.raen-ReflectA.name = 反伤-低级
status.raen-ReflectA.description = 血量被削减时，将削减部分的 10%（满血） — 45%（濒死）回敬给 18 格内最近的敌方目标。伤害有 50% 边缘衰减。
status.raen-ReflectB.name = 反伤-中级
status.raen-ReflectB.description = 血量被削减时，将削减部分的 20%（满血） — 60%（濒死）回敬给 24 格内最近的敌方目标。伤害有 50% 边缘衰减。
status.raen-ReflectC.name = 反伤-高级
status.raen-ReflectC.description = 血量被削减时，将削减部分的 30%（满血） — 75%（濒死）回敬给 30 格内最近的敌方目标。伤害有 50% 边缘衰减。

# ==================== 短时爆发 ====================
status.raen-LinkBurstA.name = 连接-短时爆发-低级
status.raen-LinkBurstA.description = 每 18 秒连接 13 格内 1 个敌方目标，持续 3 秒。连接期间自身每损失 1 点生命或护盾，就对其造成 0.75 点伤害。
status.raen-LinkBurstB.name = 连接-短时爆发-中级
status.raen-LinkBurstB.description = 每 14 秒连接 17 格内 2 个敌方目标，持续 4 秒。连接期间自身每损失 1 点生命或护盾，就对其造成 1.75 点伤害，由目标平分。
status.raen-LinkBurstC.name = 连接-短时爆发-高级
status.raen-LinkBurstC.description = 每 10 秒连接 21 格内 3 个敌方目标，持续 5 秒。连接期间自身每损失 1 点生命或护盾，就对其造成 3 点伤害，由目标平分。

# ==================== 血量转移 ====================
status.raen-LinkTransferA.name = 连接-血量转移-低级
status.raen-LinkTransferA.description = 同时连接 13 格内 1 个敌方目标与 1 个己方单位。敌方损失生命或护盾，按 75% 化为治疗平分给连接的己方。治疗优先回血，血满补盾，盾量不超过最大生命值。
status.raen-LinkTransferB.name = 连接-血量转移-中级
status.raen-LinkTransferB.description = 同时连接 17 格内 2 个敌方目标与 2 个己方单位。敌方损失生命或护盾，按 100% 化为治疗平分给连接的己方。治疗优先回血，血满补盾，盾量不超过最大生命值。
status.raen-LinkTransferC.name = 连接-血量转移-高级
status.raen-LinkTransferC.description = 同时连接 21 格内 3 个敌方目标与 2 个己方单位。敌方损失生命或护盾，按 125% 化为治疗平分给连接的己方。治疗优先回血，血满补盾，盾量不超过最大生命值。

# ==================== 分裂 ====================
status.raen-SplitA.name = 分裂-低级
status.raen-SplitA.description = 血量低于最大生命的 30% 时，分裂成两个 15% 最大生命的自身单位。
status.raen-SplitB.name = 分裂-中级
status.raen-SplitB.description = 血量低于最大生命的 40% 时，分裂成两个 25% 最大生命的自身单位。
status.raen-SplitC.name = 分裂-高级
status.raen-SplitC.description = 血量低于最大生命的 50% 时，分裂成两个 35% 最大生命的自身单位。

# ==================== 共享回复 ====================
status.raen-ShareA.name = 共享回复-低级
status.raen-ShareA.description = 每 5 秒记住 10 格内最近的 3 个己方单位，与自身组成一个组。组内任一成员受伤时，除受伤者之外的成员回复该次伤害的 2%；组内任一成员被外部治疗回复血量时，除被治疗者之外的成员回复该次治疗的 5%。回复优先回血、血满补盾；盾量不超过最大生命值的50%。
status.raen-ShareB.name = 共享回复-中级
status.raen-ShareB.description = 每 5 秒记住 15 格内最近的 5 个己方单位，与自身组成一个组。组内任一成员受伤时，除受伤者之外的成员回复该次伤害的 4%；组内任一成员被外部治疗回复血量时，除被治疗者之外的成员回复该次治疗的 8%。回复优先回血、血满补盾；盾量不超过最大生命值的50%。
status.raen-ShareC.name = 共享回复-高级
status.raen-ShareC.description = 每 5 秒记住 20 格内最近的 7 个己方单位，与自身组成一个组。组内任一成员受伤时，除受伤者之外的成员回复该次伤害的 6%；组内任一成员被外部治疗回复血量时，除被治疗者之外的成员回复该次治疗的 12%。回复优先回血、血满补盾；盾量不超过最大生命值的50%。

